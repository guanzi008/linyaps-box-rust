[package]
name = "linyaps-box"
version = "2.3.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "Rust rewrite of the Linyaps OCI runtime"

[[bin]]
name = "ll-box"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
caps = "0.5.6"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
libc = "0.2.186"
libcontainer = { path = "vendor/libcontainer", version = "0.7.0", default-features = false, features = ["systemd", "v1", "v2"] }
nix = { version = "0.29.0", features = ["fs", "mount", "process", "signal", "socket", "term", "uio", "user"] }
oci-spec = { version = "0.10.0", features = ["runtime"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
